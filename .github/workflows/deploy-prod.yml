# Production: build image in GitHub → Yandex Container Registry → roll out on VM.
#
# Required GitHub repository secrets:
#   YC_SA_JSON_CREDENTIALS   — Yandex SA JSON with container-registry.images.pusher
#   VITE_GOOGLE_CLIENT_ID     — baked into frontend (Google Drive)
#   VITE_GOOGLE_API_KEY
#   VM_HOST                   — e.g. 158.160.148.240
#   VM_USER                   — e.g. andronovsemen04
#   VM_SSH_PRIVATE_KEY        — PEM private key (metadata ssh-keys on VM)
#
# Optional (workflow_dispatch sync_runtime_env=true):
#   PRODUCTION_ENV              — full local .env content (multiline); not stored in git
#
# VM disk: uploads/ bind mount is never deleted by rollout.
name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sync_runtime_env:
        description: Upload PRODUCTION_ENV secret to VM .env before rollout
        type: boolean
        default: false
      image_tag:
        description: Override image tag (default = git sha)
        type: string
        required: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY_IMAGE: cr.yandex/crpllsmk62iiorpelole/legal-ai
  VM_REMOTE_DIR: /home/andronovsemen04/legal-ai

jobs:
  test:
    name: Pre-deploy checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend production build (gate)
        working-directory: frontend
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_API_KEY: ${{ secrets.VITE_GOOGLE_API_KEY }}
        run: |
          npm ci --legacy-peer-deps
          npm run build

  build:
    name: Build & push image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      image_latest: ${{ steps.meta.outputs.image_latest }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tags
        id: meta
        run: |
          TAG="${{ github.event.inputs.image_tag }}"
          if [[ -z "${TAG}" ]]; then
            TAG="${GITHUB_SHA::12}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${{ env.REGISTRY_IMAGE }}:${TAG}" >> "$GITHUB_OUTPUT"
          echo "image_latest=${{ env.REGISTRY_IMAGE }}:latest" >> "$GITHUB_OUTPUT"

      - name: Prepare Vite build env
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_API_KEY: ${{ secrets.VITE_GOOGLE_API_KEY }}
        run: chmod +x scripts/ci/prepare-vite-build-env.sh && ./scripts/ci/prepare-vite-build-env.sh

      - uses: docker/setup-buildx-action@v3

      - name: Login to Yandex Container Registry
        uses: yc-actions/yc-cr-login@v2
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}

      # Yandex CR accepts Docker Schema 2 only. Default Buildx provenance/SBOM
      # and registry cache are OCI indexes → "Cannot read manifest data".
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.image_latest }}
          build-args: |
            VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
            VITE_GOOGLE_API_KEY=${{ secrets.VITE_GOOGLE_API_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Google OAuth in bundle
        run: |
          docker pull "${{ steps.meta.outputs.image }}"
          docker run --rm --entrypoint sh "${{ steps.meta.outputs.image }}" -c \
            'grep -rq googleusercontent /app/frontend/dist'

  deploy:
    name: Roll out on VM
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Sync runtime .env (optional)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.sync_runtime_env == 'true'
        uses: appleboy/ssh-action@v1.2.0
        env:
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          envs: PRODUCTION_ENV,VM_REMOTE_DIR
          script: |
            set -euo pipefail
            mkdir -p "${VM_REMOTE_DIR}/uploads"
            printf '%s\n' "${PRODUCTION_ENV}" > /tmp/legal-ai.env.raw
            POSTGRES_USER="$(grep -E '^POSTGRES_USER=' /tmp/legal-ai.env.raw | head -1 | cut -d= -f2- | tr -d '"' || echo user)"
            POSTGRES_PASSWORD="$(grep -E '^POSTGRES_PASSWORD=' /tmp/legal-ai.env.raw | head -1 | cut -d= -f2- | tr -d '"' || echo password)"
            grep -v '^UPLOAD_DIR=' /tmp/legal-ai.env.raw | grep -v '^FILE_STORE_BYTES_IN_DB=' | grep -v '^CORS_ORIGINS=' | grep -v '^DATABASE_URL=' > /tmp/legal-ai.env || true
            {
              cat /tmp/legal-ai.env
              echo ""
              echo "POSTGRES_USER=${POSTGRES_USER}"
              echo "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
              echo "DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/legal_ai?sslmode=disable"
              echo "UPLOAD_DIR=/app/backend/uploads"
              echo "FILE_STORE_BYTES_IN_DB=false"
              echo "CORS_ORIGINS=https://${{ secrets.VM_HOST }},https://${{ secrets.VM_HOST }}:8000"
            } > "${VM_REMOTE_DIR}/.env"
            chmod 600 "${VM_REMOTE_DIR}/.env"
            rm -f /tmp/legal-ai.env /tmp/legal-ai.env.raw

      - name: Upload docker-compose.vm.yml
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          source: docker-compose.vm.yml
          target: ${{ env.VM_REMOTE_DIR }}/

      - name: Yandex IAM token for VM registry pull
        id: iam
        uses: yc-actions/yc-iam-token@v1
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
          mask-token: false

      - name: Roll out container
        uses: appleboy/ssh-action@v1.2.0
        env:
          LEGAL_AI_IMAGE: ${{ needs.build.outputs.image }}
          VM_REMOTE_DIR: ${{ env.VM_REMOTE_DIR }}
          YC_REGISTRY_IAM_TOKEN: ${{ steps.iam.outputs.token }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          envs: LEGAL_AI_IMAGE,VM_REMOTE_DIR,YC_REGISTRY_IAM_TOKEN
          script_stop: true
          script_path: scripts/ci/vm-remote-rollout.sh

      - name: Public health check
        run: |
          for i in $(seq 1 18); do
            if curl -sfk "https://${{ secrets.VM_HOST }}/api/health"; then
              echo "Health OK"
              exit 0
            fi
            sleep 10
          done
          echo "WARN: public health check timed out" >&2
