# PR / push validation (no deploy, no secrets beyond public deps).
name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck and production build
        env:
          VITE_GOOGLE_CLIENT_ID: ci-dummy.apps.googleusercontent.com
          VITE_GOOGLE_API_KEY: ci-dummy-key
        run: npm run build

  backend-smoke:
    name: Backend import smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-core.txt

      - name: Install core dependencies
        run: pip install -r backend/requirements-core.txt

      - name: Import app package
        working-directory: backend
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/legal_ai
        run: python -c "from app.config import config; print('config ok', config.APP_ROLE)"
