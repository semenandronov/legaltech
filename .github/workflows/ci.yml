# PR / push validation (no deploy, no secrets beyond public deps).
name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck and production build
        env:
          VITE_GOOGLE_CLIENT_ID: ci-dummy.apps.googleusercontent.com
          VITE_GOOGLE_API_KEY: ci-dummy-key
        run: npm run build

  backend-smoke:
    name: Backend import smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-core.txt

      - name: Install core dependencies
        run: pip install -r backend/requirements-core.txt

      - name: Import app package
        working-directory: backend
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/legal_ai
        run: python -c "from app.config import config; print('config ok', config.APP_ROLE)"

  tabular-unit:
    name: Tabular unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-core.txt

      - name: Install core dependencies + pytest
        run: |
          pip install -r backend/requirements-core.txt
          pip install pytest==8.3.5

      - name: Run tabular / DD classifier unit tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/legal_ai
        run: >
          python -m pytest -q
          tests/test_tabular_cell_verification.py
          tests/test_tabular_evidence_grounding.py
          tests/test_dd_document_classifier.py
          tests/test_dd_classifier_seed_gold.py
          tests/test_tabular_short_doc_policy.py
          tests/test_document_zones.py
          tests/test_contract_facts.py
          tests/test_tabular_column_kind.py
          tests/test_ru_dd_schema_eval.py
          tests/test_security_authorization.py
